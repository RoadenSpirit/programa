name: Compilar Ejecutables de Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v5

    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compilar Scripts con PyInstaller
      run: |
        pyinstaller --onefile --console --clean --noconfirm --name _preparar_tomos programaPY/_preparar_tomos.py
        pyinstaller --onefile --console --clean --noconfirm --name _renombrar_folios programaPY/_renombrar_folios.py
        pyinstaller --onefile --console --clean --noconfirm --name _limpiar_tomos programaPY/_limpiar_tomos.py

    - name: Subir Ejecutables Compilados
      uses: actions/upload-artifact@v4
      with:
        name: Procesador_Tomos_Windows_EXE
        path: dist/*.exe
